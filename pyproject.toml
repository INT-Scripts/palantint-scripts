[project]
name = "palantint-scripts"
version = "0.1.0"
description = "PalantINT Data Ingestion & OSINT Pipeline Scripts"
readme = "README.md"
authors = [{ name = "PalantINT Team" }]
requires-python = ">=3.13"
dependencies = [
    "rich",
    "httpx",
    "beautifulsoup4",
    "requests",
    "unidecode",
    "sqlmodel",
    "sqlalchemy",
    "pydantic",
    "opencv-python",
    "numpy",
    "svgpathtools",
    "questionary",
    "casint",
    "trombint",
    "agendint",
    "tsprint",
    "backend",
]

[project.scripts]
palantint-scrape = "palantint_scripts.scrape_all:main"
palantint-admin = "palantint_scripts.create_admin:main"
palantint-svg = "palantint_scripts.svg_processor:main"
palantint-blooket = "palantint_scripts.blooket:main"
palantint-print = "palantint_scripts.printing:main"

[tool.uv.sources]
backend = { path = "../backend" }
casint = { path = "../int-libraries/packages/casint" }
trombint = { path = "../int-libraries/packages/trombint" }
agendint = { path = "../int-libraries/packages/agendint" }
tsprint = { path = "../int-libraries/packages/tsprint" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palantint_scripts"]
