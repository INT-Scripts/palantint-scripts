[project]
name = "palantint-scripts"
version = "0.1.0"
description = "PalantINT Data Ingestion & OSINT Pipeline Scripts"
readme = "README.md"
authors = [{ name = "PalantINT Team" }]
requires-python = ">=3.13"
dependencies = [
    "rich",
    "httpx",
    "beautifulsoup4",
    "requests",
    "unidecode",
    "sqlmodel",
    "sqlalchemy",
    "pydantic",
    "opencv-python",
    "numpy",
    "svgpathtools",
    "questionary",
    "casint",
    "trombint",
    "maiselint",
    "agendint",
    "backend",
    "playwright>=1.60.0",
]

[project.scripts]
palantint = "palantint_scripts.cli:main"
palantint-sync = "palantint_scripts.sync:main"
palantint-admin = "palantint_scripts.admin:main"
palantint-map = "palantint_scripts.map_gen:main"

[tool.uv.sources]
backend = { path = "../backend", editable = true }
casint = { path = "../int-libraries/packages/casint", editable = true }
trombint = { path = "../int-libraries/packages/trombint", editable = true }
maiselint = { path = "../int-libraries/packages/maiselint", editable = true }
agendint = { path = "../int-libraries/packages/agendint", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palantint_scripts"]
